# Runs the news watch on saved pitches. Every hour it asks the app to check the pitches whose last
# look is older than NEWS_SCAN_HOURS (4 by default), so each pitch is checked about every 4 hours.
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   APP_URL      your deployed app, e.g. https://constellation.vercel.app
#   CRON_SECRET  the same value as CRON_SECRET in Vercel
name: News watch

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check the news on saved pitches
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET is not set; skipping."
            exit 0
          fi
          curl -sS --fail-with-body --max-time 320 -X POST \
            -H "Authorization: Bearer $CRON_SECRET" "${APP_URL%/}/api/news/cron"
